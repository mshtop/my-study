<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مذاكرتي | My Study</title>
<meta name="theme-color" content="#4f6bed">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f5f6fb;--card:#fff;--ink:#1c2333;--mut:#6a7286;--line:#e5e8f0;--pri:#4f6bed;--pri2:#eef1fe;--ok:#15803d;--okb:#e7f6ec;--bad:#c62828;--badb:#fdecec;--warn:#b45309;--warnb:#fff3df;--sh:0 1px 2px rgba(16,24,40,.05),0 6px 18px rgba(16,24,40,.06);--r:16px;color-scheme:light}
[data-theme=dark]{--bg:#0e131d;--card:#171e2c;--ink:#e7ebf4;--mut:#98a2b8;--line:#28324a;--pri:#8197ff;--pri2:#1f2844;--ok:#4ade80;--okb:#14301f;--bad:#f87171;--badb:#3a1d20;--warn:#fbbf24;--warnb:#382a10;--sh:none;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif;-webkit-tap-highlight-color:transparent}
body{padding-bottom:calc(78px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:760px;margin:0 auto;padding:12px 14px 20px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 14px 8px;max-width:760px;margin:0 auto}
.top h1{font-size:17px;margin:0;flex:1;font-weight:800;letter-spacing:-.2px}
.top h1 small{display:block;font-size:11.5px;color:var(--mut);font-weight:500}
.ib{border:1px solid var(--line);background:var(--card);border-radius:12px;width:40px;height:40px;display:grid;place-items:center;font-size:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);margin:12px 0;overflow:hidden}
.ch{display:flex;align-items:center;gap:8px;padding:12px 14px 6px}
.ch h2{font-size:15.5px;margin:0;flex:1;font-weight:800}
.ch .sub{font-size:12px;color:var(--mut)}
.cb{padding:6px 14px 14px}
.mut{color:var(--mut)}.sm{font-size:12.5px}.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:8px}.wr{flex-wrap:wrap}.sp{justify-content:space-between}.g1{flex:1;min-width:0}
.hero{background:linear-gradient(135deg,#4f6bed,#7c5cf0 60%,#c157d8);color:#fff;border:0;border-radius:20px;padding:16px;margin:8px 0 12px;box-shadow:0 10px 24px rgba(79,107,237,.25)}
.hero .big{font-size:34px;font-weight:900;line-height:1}
.hero .lbl{opacity:.9;font-size:13px}
.hero .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.hero .chip{background:rgba(255,255,255,.18);border-radius:999px;padding:4px 10px;font-size:12.5px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;box-shadow:var(--sh)}
.tile b{display:block;font-size:20px;font-weight:900}
.tile span{font-size:12px;color:var(--mut)}
.bar{height:7px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--pri);border-radius:9px}
.btn{border:0;background:var(--pri);color:#fff;border-radius:12px;padding:10px 14px;font-weight:700}
.btn.ghost{background:var(--pri2);color:var(--pri)}
.btn.line{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--badb);color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:10px}
.btn.full{width:100%}
.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 10px;font-size:13px;white-space:nowrap}
.pill.on{background:var(--pri);border-color:var(--pri);color:#fff}
.pill.ok.on{background:var(--ok);border-color:var(--ok);color:#fff}
.pill.bad.on{background:var(--bad);border-color:var(--bad);color:#fff}
.pill.warn.on{background:var(--warn);border-color:var(--warn);color:#fff}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.ls{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.ls:first-child{border-top:0}
.ls .vb{width:5px;align-self:stretch;border-radius:4px;flex:none}
.ls .act{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.pr{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.pr button{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 2px;text-align:center}
.pr button b{display:block;font-size:13px}
.pr button small{font-size:11.5px;color:var(--mut)}
.pr button.s1{background:var(--okb);border-color:var(--ok)}
.pr button.s1 b{color:var(--ok)}
.pr button.s2{background:var(--warnb);border-color:var(--warn)}
.pr button.s2 b{color:var(--warn)}
.pr button.nx{outline:2px solid var(--pri);outline-offset:1px}
.chk{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.step button{border:0;background:transparent;width:32px;height:30px;font-size:17px}
.step b{min-width:26px;text-align:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.sc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:start;box-shadow:var(--sh);position:relative;overflow:hidden}
.sc:before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:5px;background:var(--c)}
.sc b{display:block;font-size:14.5px}
.tag{font-size:11px;border-radius:6px;padding:1px 6px;background:var(--pri2);color:var(--pri)}
.tag.gr{background:var(--line);color:var(--mut)}
.unit{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.unit:first-child{border-top:0}
.st0{background:var(--line);color:var(--mut)}.st1{background:#e0ecff;color:#1d4ed8}.st2{background:#efe6ff;color:#6d28d9}.st3{background:var(--warnb);color:var(--warn)}.st4{background:var(--okb);color:var(--ok)}
[data-theme=dark] .st1{background:#1c2a4a;color:#93b4ff}[data-theme=dark] .st2{background:#2b2148;color:#c4b5fd}
.stb{border:0;border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:700;white-space:nowrap}
.f{display:grid;gap:4px;margin-bottom:10px}
.f label{font-size:12.5px;color:var(--mut);font-weight:600}
.in{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:11px;padding:9px 11px;min-height:42px}
textarea.in{min-height:90px;resize:vertical}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.days{display:flex;gap:5px;flex-wrap:wrap}
.days label{border:1px solid var(--line);border-radius:10px;padding:5px 9px;font-size:13px;display:flex;gap:4px;align-items:center}
.days input:checked+span{font-weight:800;color:var(--pri)}
.bars{display:flex;align-items:flex-end;gap:6px;height:110px;padding-top:6px}
.bars div{flex:1;text-align:center;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.bars i{display:block;background:var(--pri);border-radius:6px 6px 3px 3px;min-height:3px}
.bars i.td{background:#c157d8}
.bars small{font-size:10.5px;color:var(--mut);margin-top:3px}
.bars em{font-style:normal;font-size:10.5px;color:var(--mut)}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th,table.t td{padding:7px 4px;border-top:1px solid var(--line);text-align:start}
table.t th{font-size:12px;color:var(--mut);font-weight:700;border-top:0}
.acc{font-weight:800}.a3{color:var(--ok)}.a2{color:var(--warn)}.a1{color:var(--bad)}
.empty{color:var(--mut);text-align:center;padding:14px 6px;font-size:13.5px}
.nav{position:fixed;bottom:0;inset-inline:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:6}
.nav div{display:flex;max-width:760px;width:100%}
.nav button{flex:1;border:0;background:transparent;padding:4px 2px;border-radius:12px;font-size:11.5px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:1px}
.nav button i{font-style:normal;font-size:20px;line-height:1.2}
.nav button.on{color:var(--pri);font-weight:800;background:var(--pri2)}
.toast{position:fixed;bottom:calc(90px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#1c2333;color:#fff;padding:9px 16px;border-radius:12px;font-size:13.5px;z-index:50;opacity:0;pointer-events:none;transition:.25s;max-width:92vw;text-align:center}
.toast.show{opacity:1}
.ov{position:fixed;inset:0;background:rgba(10,14,25,.5);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 12px;font-size:17px}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:20px}}
.fx{position:fixed;inset:0;z-index:40;background:linear-gradient(160deg,#1d2a5c,#3b2a6e 55%,#5a2a6a);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:safe center;overflow-y:auto;padding:24px;text-align:center}
.fx .clk{font-size:min(23vw,150px);font-weight:900;letter-spacing:-2px;line-height:1;font-variant-numeric:tabular-nums;direction:ltr}
.fx .sub{opacity:.85;margin:8px 0 18px}
.fx .modes{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;justify-content:center}
.fx .modes button{white-space:nowrap}
.fx .modes button{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:999px;padding:6px 12px}
.fx .modes button.on{background:#fff;color:#3b2a6e;font-weight:800}
.fx .ctl{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.fx .ctl button{border:0;border-radius:14px;padding:12px 18px;font-weight:800;background:rgba(255,255,255,.16);color:#fff}
.fx .ctl button.main{background:#fff;color:#3b2a6e}
.fx select{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:10px;padding:7px 10px;margin-bottom:14px;max-width:90vw}
.fx select option{color:#000}
.fx .ring{width:min(70vw,300px);height:6px;background:rgba(255,255,255,.18);border-radius:9px;overflow:hidden;margin:14px auto 0}
.fx .ring i{display:block;height:100%;background:#fff}
.run{position:sticky;top:calc(58px + env(safe-area-inset-top));z-index:4;margin:6px 0;background:#3b2a6e;color:#fff;border:0;border-radius:12px;padding:8px 12px;width:100%;display:flex;gap:8px;align-items:center;font-weight:700}
.run .num{margin-inline-start:auto;direction:ltr}
.fc{text-align:center;padding:22px 12px}
.fc .w{font-size:30px;font-weight:900;direction:ltr}
.fc .m{font-size:20px;margin-top:10px;color:var(--pri);font-weight:800}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;background:transparent;padding:7px 12px;font-size:13px}
.seg button.on{background:var(--pri);color:#fff}
.dh{display:flex;align-items:center;gap:8px;margin:14px 2px 4px;font-weight:800;font-size:14px}
.dh .tag{font-weight:700}
.x{border:0;background:transparent;color:var(--mut);font-size:16px;padding:2px 6px}
hr.s{border:0;border-top:1px solid var(--line);margin:12px 0}
.ltr{direction:ltr;unicode-bidi:isolate}
.dp{position:relative;margin:6px 0 4px}
.dp-hr{position:absolute;inset-inline:0;border-top:1px solid var(--line);height:0}
.dp-hr span{position:absolute;inset-inline-start:0;top:-9px;font-size:11px;color:var(--mut);background:var(--card);padding:0 4px}
.dp-slot{position:absolute;inset-inline-start:50px;inset-inline-end:24px;background:transparent;border:0;border-radius:8px}
.dp-slot:hover{background:var(--pri2)}
.dp-bg{position:absolute;inset-inline-start:50px;inset-inline-end:24px;border-radius:10px;padding:5px 10px;font-size:12px;font-weight:700;pointer-events:none}
.dp-bg.sleep{background:repeating-linear-gradient(45deg,color-mix(in srgb,#6366f1 12%,transparent) 0 8px,transparent 8px 16px);color:#6366f1}
.dp-bg.school{background:color-mix(in srgb,#64748b 16%,transparent);color:var(--mut)}
.dp-ls{position:absolute;inset-inline-start:56px;inset-inline-end:30px;border-radius:10px;padding:4px 10px;font-size:12.5px;font-weight:700;border:2px dashed var(--c);background:color-mix(in srgb,var(--c) 10%,transparent);color:var(--ink);z-index:1;overflow:hidden}
.dp-blk{position:absolute;inset-inline-start:58px;inset-inline-end:32px;border:0;border-inline-start:5px solid var(--c);background:color-mix(in srgb,var(--c) 15%,var(--card));border-radius:10px;padding:3px 10px;text-align:start;overflow:hidden;font-size:13px;line-height:1.35;color:var(--ink);z-index:1;box-shadow:var(--sh)}
.dp-blk small{display:block;color:var(--mut);font-size:11.5px}
.dp-blk.drag{opacity:.85;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:5}
.dp-grip,.dp-rs{position:absolute;touch-action:none;z-index:2}
.dp-grip{top:2px;inset-inline-end:4px;width:30px;height:30px;display:grid;place-items:center;border-radius:8px;color:var(--mut);font-size:16px;background:color-mix(in srgb,var(--card) 70%,transparent)}
.dp-rs{inset-inline:0;bottom:0;height:12px;cursor:ns-resize}
.dp-rs:after{content:"";position:absolute;left:50%;bottom:3px;width:34px;height:4px;margin-left:-17px;border-radius:3px;background:var(--c);opacity:.6}
.dp-pr{position:absolute;inset-inline-start:50px;inset-inline-end:24px;min-height:18px;border:0;background:color-mix(in srgb,#f59e0b 24%,var(--card));color:var(--ink);border-radius:8px;font-size:11.5px;font-weight:700;padding:0 8px;text-align:start;z-index:2;display:flex;align-items:center;gap:6px}
.dp-pr.ok{background:color-mix(in srgb,#16a34a 24%,var(--card))}
.dp-act{position:absolute;inset-inline-end:5px;width:13px;border-radius:7px;background:var(--ok);z-index:3;min-height:4px}
.dp-now{position:absolute;inset-inline-start:42px;inset-inline-end:0;border-top:2px solid #ef4444;z-index:4;pointer-events:none}
.qp{position:fixed;inset-inline:0;bottom:0;z-index:35;background:var(--card);border-radius:20px 20px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.25);max-height:72vh;overflow:auto;padding:14px 16px calc(16px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto}
.qp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:10px}
.qp-chip{border:1px solid var(--line);border-inline-start:5px solid var(--c);background:color-mix(in srgb,var(--c) 10%,var(--card));border-radius:12px;padding:10px;text-align:start;font-size:13.5px;font-weight:700;min-height:48px}
.qp-chip small{display:block;font-weight:500;color:var(--mut);font-size:11.5px}
.qp-chip.hot{box-shadow:0 0 0 2px var(--pri)}
.qjz{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px}
.qjz div{border:1px solid var(--line);border-radius:10px;padding:5px 4px;text-align:center;font-size:11.5px;position:relative;overflow:hidden}
.qjz div i{position:absolute;inset-inline-start:0;bottom:0;height:4px;background:var(--ok)}
.qsr{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px}
.qsr button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 8px;text-align:start;font-size:12.5px;position:relative;overflow:hidden}
.qsr button i{position:absolute;inset-inline-start:0;bottom:0;height:4px;background:var(--ok)}
.qsr button.m{background:var(--okb);border-color:var(--ok)}
.qsr button small{display:block;color:var(--mut);font-size:11px}
.grd0{background:var(--okb);color:var(--ok)}.grd1{background:#e0f2fe;color:#0369a1}.grd2{background:var(--pri2);color:var(--pri)}.grd3{background:var(--warnb);color:var(--warn)}.grd4{background:var(--badb);color:var(--bad)}
.ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:var(--card);flex:none;font-weight:900;color:#fff;padding:0;line-height:1}
.ck.on{background:var(--ok);border-color:var(--ok)}
.nav button{min-width:0}.nav button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
</style>
</head>
<body>
<header class="top" id="top"></header>
<main class="wrap" id="app"></main>
<nav class="nav" id="nav"></nav>
<div class="toast" id="toast"></div>
<div id="modal"></div>
<div id="focus"></div>
<script>
'use strict';
/* ========== helpers ========== */
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const today=()=>iso(new Date());
const addD=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toMin=h=>{if(!h)return 0;const[a,b]=h.split(':').map(Number);return a*60+b};
const sum=a=>a.reduce((x,y)=>x+(+y||0),0);

/* ========== strings (AR / EN) ========== */
const STR={ar:{
app:'مذاكرتي',appSub:'ثانوية عامة',tmFlex:'🌿 مرن (بذاكر على نفس الجهاز)',tmStrict:'🔒 صارم',awayQ:'غبت {m} دقيقة عن التطبيق — كنت بتذاكر؟',awayStudy:'📖 كنت بذاكر (PDF / تطبيق تاني)',awayDistr:'😅 اتشتت',awayStudyOk:'تمام 👍 الشجرة مكملة',awayDistrOk:'اتسجل التشتت ({m} د) — الشجرة اتأثرت {n}/3',treeFlexHint:'الوضع المرن: لو خرجت من التطبيق هنسألك لما ترجع. جاوب بصدق — 3 مرات تشتت = الشجرة تدبل، ودقايق التشتت مش هتتحسب.',treeHurtT:'الشجرة اتأثرت {n}/3 — ركّز 💪',fruitT:'🍎 شجرة مثمرة! 90 دقيقة تركيز',onTimeT:'⏰ في الميعاد! +20 نقطة',focusAvg:'متوسط التركيز (7 أيام)',distrPeak:'أكتر وقت بتتشتت فيه',recentSess:'آخر الجلسات المسجلة',delSessQ:'حذف الجلسة دي؟ هتتشال دقايقها من الإحصائيات.',sessDeleted:'اتحذفت الجلسة',

function tzOff(zone,dIso,fb){try{const p=new Intl.DateTimeFormat('en-US',{timeZone:zone,timeZoneName:'shortOffset'}).formatToParts(new Date(dIso+'T12:00:00Z')).find(x=>x.type==='timeZoneName').value;

 if(ct){const z=ZONE[ct[4]];return{lat:ct[0],lng:ct[1],tz:tzOff(z[0],dIso,z[1]),m:ct[4]==='eg'?'egypt':'uq'}}
 const lat=parseFloat(c.lat),lng=parseFloat(c.lng);return{lat:isNaN(lat)?30.0444:lat,lng:isNaN(lng)?31.2357:lng,tz:-new Date(dIso+'T12:00:00').getTimezoneOffset()/60,m:c.method==='uq'?'uq':'egypt'}}

  const RA=Math.atan2(Math.cos(e*rad)*Math.sin(Lm*rad),Math.cos(Lm*rad))/rad/15,decl=Math.asin(Math.sin(e*rad)*Math.sin(Lm*rad))/rad;let eqt=q/15-((RA%24)+24)%24;eqt=((eqt+12)%24+24)%24-12;return{decl,eqt}};
 const noonAt=x=>12-sun(jd+x/24).eqt;
 const angleTime=(a,x,ccw)=>{const{decl}=sun(jd+x/24),n=noonAt(x);const c=(-Math.sin(a*rad)-Math.sin(decl*rad)*Math.sin(lat*rad))/(Math.cos(decl*rad)*Math.cos(lat*rad));const h=Math.acos(Math.max(-1,Math.min(1,c)))/rad/15;return n+(ccw?-h:h)};
 const asrTime=x=>{const{decl}=sun(jd+x/24);const a=-Math.atan(1/(1+Math.tan(Math.abs(lat-decl)*rad)))/rad;return angleTime(a,x)};

 for(let i=0;i<2;i++)T={fajr:angleTime(eg?19.5:18.5,T.fajr,true),sunrise:angleTime(.833,T.sunrise,true),dhuhr:noonAt(T.dhuhr),asr:asrTime(T.asr),maghrib:angleTime(.833,T.maghrib),isha:eg?angleTime(17.5,T.isha):0};

 const adj=L.tz-lng/15,out={};
 for(const k in T){const m=Math.round((T[k]+adj)*60);out[k]=pad(Math.floor(((m/60)%24+24)%24))+':'+pad(((m%60)+60)%60)}

let VOICES=[];
function loadVoices(){try{VOICES=window.speechSynthesis?speechSynthesis.getVoices()||[]:[]}catch(e){VOICES=[]}}

function enVoice(){const L=VOICES.filter(v=>/^en([-_]|$)/i.test(v.lang||''));return L.find(v=>v.localService&&/US/i.test(v.lang))||L.find(v=>v.localService)||L.find(v=>/US/i.test(v.lang))||L[0]||null}
function speakDevice(txt){return new Promise((res,rej)=>{try{const ss=window.speechSynthesis;if(!ss||typeof SpeechSynthesisUtterance==='undefined')return rej('none');
 if(ss.speaking||ss.pending)ss.cancel();const u=new SpeechSynthesisUtterance(txt),v=enVoice();if(v)u.voice=v;u.lang=v?v.lang:'en-US';u.rate=.9;
 let started=false;u.onstart=()=>{started=true};u.onend=()=>res();u.onerror=e=>{if(!started)rej(e&&e.error||'err');else res()};
 setTimeout(()=>{try{ss.resume&&ss.resume();ss.speak(u)}catch(e){rej(e)}},80);setTimeout(()=>{if(!started&&!ss.speaking)rej('timeout')},2500)}catch(e){rej(e)}})}
let SPK=false;
async function speak(txt){if(SPK)return;SPK=true;try{loadVoices();
 if(window.speechSynthesis&&(enVoice()||!VOICES.length)){try{await speakDevice(txt);return}catch(e){}}

/* ========== FOCUS CLOCK + tree (Forest) + pomodoro (FLIP) ========== */
const FKEY='thn-focus';
let F=null;try{F=JSON.parse(localStorage.getItem(FKEY)||'null')}catch(e){}
let fOpen=false,wake=null;
const fSave=()=>{try{F?localStorage.setItem(FKEY,JSON.stringify(F)):localStorage.removeItem(FKEY)}catch(e){}};
const fElapsed=()=>F?Math.max(0,((F.paused?F.paused:Date.now())-F.start-(F.pausedTotal||0))/1000):0;
function clock(sec){sec=Math.max(0,Math.floor(sec));const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return (h?h+':'+pad(m):pad(m))+':'+pad(s)}
const POMO=[[25,'w'],[5,'b'],[25,'w'],[5,'b'],[25,'w'],[5,'b'],[25,'w'],[15,'b']];
function pomoState(e){const k=Math.floor(e/7200);let r=e-k*7200,work=k*6000,round=k*4,i=0;
 for(;i<POMO.length-1;i++){const L=POMO[i][0]*60;if(r<L)break;r-=L;if(POMO[i][1]==='w'){work+=L;round++}}
 const seg=POMO[i];if(seg[1]==='w'){work+=r;round++}return{type:seg[1],len:seg[0]*60,left:seg[0]*60-r,work,round,idx:k*8+i,long:seg[0]===15}}
const isPomo=()=>F&&F.target===-1;
const fWork=()=>isPomo()?pomoState(fElapsed()).work:fElapsed();
const inBreak=()=>isPomo()&&pomoState(fElapsed()).type==='b';
const treeMode=()=>localStorage.getItem('thn-treeMode')||'flex';
const treeP=()=>!F?0:(F.target>0?Math.min(1,fElapsed()/(F.target*60)):Math.min(1,fWork()/1500))*(1-.25*(F.hits||0));
const isFruit=()=>F&&!F.dead&&fWork()/60-(F.distr||0)>=90;

function xpAll(){let x=0;Object.values(D.sessions).forEach(s=>{x+=s.min||0;if(s.onTime)x+=20;if(s.fruit)x+=30});
 Object.values(D.days).forEach(d=>{PR.forEach(k=>{const v=(d.pr||{})[k];x+=v===1?10:v===2?5:0});x+=(d.am?5:0)+(d.pm?5:0)+(d.witr?5:0)+(d.qr||0)*2});
 Object.values(D.att).forEach(a=>{if(a.st==='ok')x+=15;if(a.hw)x+=10});Object.values(D.qs).forEach(q=>x+=+q.correct||0);
 Object.values(D.tasks).forEach(k=>{if(k.done)x+=10});Object.values(D.revlog).forEach(n=>x+=2*n);Object.values(QZ().logs).forEach(l=>{x+=l.type==='new'&&l.g<4?(l.b-l.a+1)*2:10});return x}
function level(x){let l=1,need=100,acc=0;while(x>=acc+need){acc+=need;l++;need=100+(l-1)*50}return{l,cur:Math.round(x-acc),need,x}}

function streak(test){let d=today(),n=0;if(!test(d))d=addD(d,-1);while(n<2000&&test(d)){n++;d=addD(d,-1)}return n}

function bestRun(test){let d=firstDate(),e=today(),best=0,cur=0,g=0;while(d<=e&&g<1500){if(test(d)){cur++;if(cur>best)best=cur}else cur=0;d=addD(d,1);g++}return best}

  ['q100','✍️',qc>=100],['q1000','🧠',qc>=1000],['t10','🌳',trees>=10],['t50','🌲',trees>=50],['w50','🔤',wm>=50],['hw20','📝',hw>=20],['tk50','✅',tk50(tkd)],['ot10','⏰',Object.values(D.sessions).filter(x=>x.onTime).length>=10],['fr5','🍎',Object.values(D.sessions).filter(x=>x.fruit).length>=5],['qs5','📖',Object.keys(QZ().mem).filter(s=>qMemN(+s)>=QURAN.c[s-1]).length>=5],['qj1','🌟',qTotals().jd>=1]]}

 overdueTasks().forEach(([id,tk])=>{const best=days.reduce((a,b)=>load[b]<load[a]?b:a,days[0]);tk.date=best;tk.mk=1;load[best]++});save()}

/* ========== CALENDAR (.ics) ========== */
function icsEsc(x){return String(x||'').replace(/\\/g,'\\\\').replace(/;/g,'\;').replace(/,/g,'\\,').replace(/\n/g,'\\n')}
function icsExport(){const now=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z',dt=x=>x.replace(/-/g,''),tm=h=>h.replace(':','')+'00',BY=['SU','MO','TU','WE','TH','FR','SA'];
 const endOf=(st,du)=>{let m=Math.min(toMin(st)+(+du||60),1439);return pad(Math.floor(m/60))+':'+pad(m%60)};
 const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//MyStudy//Thanaweya//AR','CALSCALE:GREGORIAN','X-WR-CALNAME:'+icsEsc(t('lessons'))];
 const ev=(id,date,l,rr)=>{L.push('BEGIN:VEVENT','UID:'+id+'@my-study','DTSTAMP:'+now,'DTSTART:'+dt(date)+'T'+tm(l.start),'DTEND:'+dt(date)+'T'+tm(endOf(l.start,l.dur)));if(rr)L.push(rr);
  L.push('SUMMARY:'+icsEsc('📚 '+sname(l.sid)+(l.teacher?' — '+l.teacher:'')),'LOCATION:'+icsEsc(l.place),'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(sname(l.sid)),'TRIGGER:-PT30M','END:VALARM','END:VEVENT')};
 let n=0;Object.entries(D.lessons).forEach(([id,l])=>{let d=today();while(parse(d).getDay()!==l.dow)d=addD(d,1);ev(id,d,l,'RRULE:FREQ=WEEKLY;BYDAY='+BY[l.dow]+';UNTIL=20270731T235959');n++});
 Object.entries(D.extra).forEach(([id,l])=>{if(l.date>=today()){ev(id,l.date,l);n++}});
 if(!n)return toast(t('calNone'));L.push('END:VCALENDAR');
 const blob=new Blob([L.join('\r\n')],{type:'text/calendar'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='my-lessons.ics';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);toast(t('calHint'))}

function prBandsS(d){const T=prayerTimes(d),fri=parse(d).getDay()===5,L={fajr:20,dhuhr:20,asr:20,maghrib:15,isha:20};return PR.map(k=>{const a=toMin(T[k]);return{k,a,e:a+(k==='dhuhr'&&fri?45:L[k]),tm:T[k],name:k==='dhuhr'&&fri?t('jumuah'):t(k)}})}
function wakeBedS(){const R=routineS();let w=toMin(R.sleep[1]),b=toMin(R.sleep[0]);if(b<=w)b=1435;return[w,b]}
function busyS(d){const R=routineS(),o=[];if(R.schoolDays.includes(parse(d).getDay()))o.push([toMin(R.school[0]),toMin(R.school[1])]);prBandsS(d).forEach(p=>o.push([p.a-5,p.e+5]));
 lessonsOn(d).forEach(l=>{const a=toMin(l.start);o.push([a-15,a+(+l.dur||60)+15])});dayBlocksS(d).forEach(b=>o.push([toMin(b.start),toMin(b.end)]));return o.sort((x,y)=>x[0]-y[0])}
function freeS(d,from){const[w,bed]=wakeBedS();let a=Math.max(w,from||0);const out=[];for(const[s,e]of busyS(d)){if(e<=a)continue;if(s>a)out.push([Math.ceil(a/5)*5,Math.min(s,bed)]);a=Math.max(a,e);if(a>=bed)break}if(a<bed)out.push([Math.ceil(a/5)*5,bed]);return out.filter(x=>x[1]-x[0]>=20)}

function autoFillS(d){const n0=new Date(),from=d===today()?Math.ceil((n0.getHours()*60+n0.getMinutes()+5)/15)*15:0,goal=+D.cfg.goal||300;
 dayBlocksS(d).filter(b=>b.auto).forEach(b=>delete D.blocks[b.id]);
 let need=goal-dayBlocksS(d).reduce((a,b)=>a+toMin(b.end)-toMin(b.start),0)-(d===today()?studyMin(d):0);
 const tom=new Set(lessonsOn(addD(d,1)).map(l=>l.sid)),subs=D.subjects.filter(s=>s.counted||tom.has(s.id)).sort((a,b)=>(tom.has(b.id)-tom.has(a.id))||(subjWeekMin(a.id,d)-subjWeekMin(b.id,d)));
 let slots=freeS(d,from),n=0,i=0;while(need>=20&&slots.length&&subs.length){const sl=slots[0],len=Math.min(50,need,sl[1]-sl[0]);if(len<20){slots.shift();continue}
  const sb=subs[i%subs.length];i++;D.blocks[uid()]={date:d,start:hmS(sl[0]),end:hmS(sl[0]+len),sid:sb.id,note:'',auto:1};n++;need-=len;sl[0]+=len+10;if(sl[1]-sl[0]<20)slots.shift()}
 save();toast(n?t('dpFilled').replace('{n}',n):t('dpNoFree'));render()}

 const st=Math.max(0,Math.floor((w-60)/60)*60),en=Math.min(1440,Math.ceil((Math.min(bed,1435)+60)/60)*60),Y=m=>((Math.max(st,Math.min(en,m))-st)/60*DPH).toFixed(1);

 LS.forEach(l=>{const a=toMin(l.start),e=a+(+l.dur||60),sb=subj(l.sid);g+=`<div class="dp-ls" style="top:${Y(a)}px;height:${Math.max(22,Y(e)-Y(a)).toFixed(1)}px;--c:${sb.color}">📅 ${t('lessonBand')}: ${esc(sname(sb))}${l.teacher?' · '+esc(l.teacher):''} <span class="num mut">${fmtT(l.start)}</span></div>`});

document.addEventListener('pointerdown',e=>{const h=e.target.closest('[data-drag]');if(!h)return;const el=h.closest('.dp-blk'),b=D.blocks[h.dataset.id];if(!el||!b)return;e.preventDefault();
 DRAG={id:h.dataset.id,mode:h.dataset.drag,y0:e.clientY,el,top0:parseFloat(el.style.top),h0:parseFloat(el.style.height),a:toMin(b.start),e:toMin(b.end),moved:false};try{h.setPointerCapture(e.pointerId)}catch(x){}});

 const dm=Math.round(dy/DPH*60/15)*15;let a=DRAG.a,en=DRAG.e;if(DRAG.mode==='move'){a=Math.max(0,Math.min(1435-(en-a),a+dm));en=a+(DRAG.e-DRAG.a);DRAG.el.style.top=(DRAG.top0+(a-DRAG.a)/60*DPH)+'px'}else{en=Math.max(a+15,Math.min(1435,DRAG.e+dm));DRAG.el.style.height=Math.max(20,DRAG.h0+(en-DRAG.e)/60*DPH)+'px'}
 DRAG.na=a;DRAG.ne=en;const lb=DRAG.el.querySelector('[data-blt]');if(lb)lb.textContent=hmS(a)+'–'+hmS(en)+' · '+dur(en-a)});

 qpPick:b=>{const a=toMin(QPK),m=+localStorage.getItem('thn-qpdur')||50;D.blocks[uid()]={date:V.dd||today(),start:QPK,end:hmS(Math.min(a+m,1435)),sid:b.dataset.s,note:''};QPK=null;save();toast(t('qpAdded').replace('{x}',sname(b.dataset.s)));render()},
 qpMore:()=>{const a=toMin(QPK),m=+localStorage.getItem('thn-qpdur')||50,id=uid();D.blocks[id]={date:V.dd||today(),start:QPK,end:hmS(Math.min(a+m,1435)),sid:D.subjects[0].id,note:''};QPK=null;save();render();blkForm(id)},
 rtSave:()=>{const v=id=>$('#'+id).value;D.cfg.routine={sleep:[v('rt-sl')||'23:00',v('rt-wk')||'06:00'],school:[v('rt-s1')||'08:00',v('rt-s2')||'14:00'],schoolDays:[...document.querySelectorAll('.rt-sd:checked')].map(x=>+x.value)};save();toast(t('saved'));render()},
 bkSave:b=>{const x=D.blocks[b.dataset.id],s0=$('#bk-s').value,e0=$('#bk-e').value;if(!s0||!e0||toMin(e0)<=toMin(s0))return toast(t('needTime'));Object.assign(x,{start:s0,end:e0,sid:$('#bk-sb').value,uid:$('#bk-u').value,note:$('#bk-n').value.trim(),auto:0});save();closeModal();render()},
 bkDel:b=>{delete D.blocks[b.dataset.id];save();closeModal();render()},
 qLog:()=>qLogForm(),
 qSet:()=>qSetForm(),
 qSur:b=>qSurForm(+b.dataset.s),
 qMemSet:b=>{$('#qm-n').value=b.dataset.v},
 qMemSave:b=>{const sn=+b.dataset.s,c=QURAN.c[sn-1],n=Math.max(0,Math.min(c,parseInt($('#qm-n').value)||0)),Q=QZ();if(n)Q.mem[sn]=Object.assign(Q.mem[sn]||{},{n,last:(Q.mem[sn]||{}).last||today()});else delete Q.mem[sn];save();closeModal();toast(t('qSaved'));render()},
 qRev:b=>{const Q=QZ(),sn=+b.dataset.s;if(Q.mem[sn])Q.mem[sn].last=today();Q.logs[uid()]={date:today(),type:'near',s:sn,a:1,b:qMemN(sn),g:0,mis:0,notes:'',self:1,ts:Date.now()};save();render()},
 qDel:async b=>{if(await ask(t('delQ'))){delete QZ().logs[b.dataset.id];save();render()}},
 qSetSave:()=>{const Q=QZ();Q.cfg.teacher=$('#qs-t').value.trim();Q.cfg.dir=$('#qs-d').value;Q.cfg.rev=Math.max(.5,parseFloat($('#qs-r').value)||2);ensureQrn();save();closeModal();toast(t('qSaved'));render()},
 qHalaqa:()=>{const Q=QZ();Q.cfg.teacher=$('#qs-t').value.trim();ensureQrn();save();closeModal();lessonForm();setTimeout(()=>{const f=$('#fs');if(f)f.value='qrn';const tt=$('#ft');if(tt&&!tt.value)tt.value=Q.cfg.teacher;const pl=$('#fp');if(pl&&!pl.value)pl.value=LANG==='ar'?'الحلقة':'Halaqa'},30)},
 qLogSave:()=>{const Q=QZ(),sn=+$('#ql-s').value,a=parseInt($('#ql-a').value),bb=parseInt($('#ql-b').value),c=QURAN.c[sn-1],g=+(document.querySelector('input[name=ql-g]:checked')||{value:0}).value,ty=$('#ql-t').value,d=$('#ql-d').value||today();
  if(!(a>=1&&bb>=a&&bb<=c))return toast(t('qBadRange'));
  Q.logs[uid()]={date:d,type:ty,s:sn,a,b:bb,g,mis:Math.max(0,parseInt($('#ql-m').value)||0),notes:$('#ql-n').value.trim(),ts:Date.now()};
  const tc=$('#ql-tc').value.trim();if(tc)Q.cfg.teacher=tc;
  const m=Q.mem[sn]||(Q.mem[sn]={n:0});if(ty==='new'&&g<4&&a<=m.n+1)m.n=Math.max(m.n||0,bb);m.last=d;if(!m.n)delete Q.mem[sn];
  const ns=+$('#qn-s').value,na=parseInt($('#qn-a').value),nb=parseInt($('#qn-b').value);if(ns&&na>=1&&nb>=na&&nb<=QURAN.c[ns-1])Q.next={s:ns,a:na,b:nb,due:$('#qn-d').value||nextHalaqa()};else if(Q.next&&Q.next.s===sn&&ty==='new'&&g<4&&bb>=Q.next.b)Q.next=null;
  ensureQrn();save();closeModal();toast(t('qSaved'));render()},
 export:()=>{const blob=new Blob([JSON.stringify(D,null,1)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='my-study-backup-'+today()+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)},
 erase:async()=>{if(await ask(t('eraseQ'))){D=defaults();D.cfg.lang=LANG;V.su=null;save();F=null;fSave();toast(t('saved'));render()}}
};
function ensureQrn(){if(!D.subjects.some(x=>x.id==='qrn'))D.subjects.push({id:'qrn',ar:CAT.qrn[0],en:CAT.qrn[1],color:CAT.qrn[2],counted:false})}
document.addEventListener('click',e=>{const sl=e.target.closest('[data-dpslot]');if(sl){const rc=sl.getBoundingClientRect(),off=Math.max(0,Math.min(45,Math.floor((e.clientY-rc.top)/DPH*60/15)*15));QPK=hmS(toMin(sl.dataset.dpslot)+off);render();return}
 const bk=e.target.closest('[data-dpb]');if(bk&&!e.target.closest('[data-drag]')){if(DRAGGED)return;blkForm(bk.dataset.dpb);return}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const f=A[b.dataset.act];if(f)f(b,e)});
document.addEventListener('change',async e=>{
 if(e.target.id==='bk-sb'){$('#bk-u').innerHTML=unitOpts(e.target.value)}
 if(e.target.id==='su-city')V.su.city=e.target.value;
 if(e.target.id==='s-grade'){$('#s-stream').innerHTML=streamOpts(+e.target.value,'')}
 if(e.target.id==='qs-s'){$('#qs-u').innerHTML=unitOpts(e.target.value)}
 if(e.target.id==='imp'){const f=e.target.files[0];if(!f)return;try{const x=JSON.parse(await f.text());if(!x||!Array.isArray(x.subjects)||!x.cfg)throw 0;
  if(await ask(t('importQ'))){D=normalize(x);LANG=D.cfg.lang==='en'?'en':'ar';save();applyTheme();toast(t('imported'));render()}}catch(err){toast(t('badFile'))}e.target.value=''}});
document.addEventListener('input',e=>{if(e.target.id==='su-name')V.su.name=e.target.value;if(e.target.id==='wq'){V.wq=e.target.value;const q=V.wq.toLowerCase(),all=Object.entries(D.words).sort((a,b)=>(b[1].added||'').localeCompare(a[1].added||''));$('#wlist').innerHTML=wordList(q?all.filter(([,w])=>(w.en+' '+w.ar).toLowerCase().includes(q)):all)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#modal').innerHTML)closeModal();else if(fOpen)closeFocus()}});
// refresh every minute (next prayer, day change) unless the user is typing
let lastDay=today();
setInterval(()=>{if(busy()||fOpen)return;if(V.tab==='today'||today()!==lastDay){lastDay=today();render()}},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!busy()&&!fOpen)render()});

/* ========== start ========== */
applyTheme();if(F)checkWither();render();if(F&&D.cfg.setup)openFocus();
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
</script>
